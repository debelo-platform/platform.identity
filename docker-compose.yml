
services:
  identity-api:
    image: ${DOCKER_REGISTRY:-}identity-api
    build:
      context: .
      dockerfile: identity.api/Dockerfile
    networks:
      - platform-identity-network
    depends_on:
      identity-provider:
        condition: service_started

  identity-provider:
    container_name: identity-provider
    image: quay.io/keycloak/keycloak:latest
    command:
      - start-dev
      - --import-realm
      - --features=organization:v1
      - --hostname=http://localhost:8081
      - --hostname-backchannel-dynamic=true
      - --spi-theme-static-max-age=-1
      - --spi-theme-cache-themes=false
      - --spi-theme-cache-templates=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-database:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change-me}
    ports:
      - "8081:8080"
    volumes:
      - ./configs/keycloak/realms:/opt/keycloak/data/import:ro
      - ./configs/keycloak/themes/platform:/opt/keycloak/themes/platform:ro
    networks:
      - platform-identity-network
    depends_on:
      identity-database:
        condition: service_healthy

  identity-database:
    container_name: identity-database
    image: postgres:latest
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change-me}
    ports:
      - "5433:5432"
    volumes:
      - identity-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-identity-network

volumes:
  identity-postgres-data:

networks:
  platform-identity-network:
    driver: bridge
