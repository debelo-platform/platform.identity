name: Identity Dev CI

on:
  push:
    branches:
      - dev
    paths:
      - 'platform.identity/**'
      - '.github/workflows/identity-ci.yml'

  pull_request:
    branches:
      - dev
    paths:
      - 'platform.identity/**'
      - '.github/workflows/identity-ci.yml'

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/identity

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore platform.identity/identity.api.tests/identity.api.tests.csproj

      - name: Build
        run: dotnet build platform.identity/identity.api.tests/identity.api.tests.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test platform.identity/identity.api.tests/identity.api.tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  build-and-push:
    needs: unit-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    environment:
      name: Development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Dockerfile
        run: |
          test -f ./platform.identity/security.api/Dockerfile
          echo "Dockerfile found."

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./platform.identity
          file: ./platform.identity/security.api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
